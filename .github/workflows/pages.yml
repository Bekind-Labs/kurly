name: Website

# Builds the landing page (site/) and publishes it to GitHub Pages from main.
# Pull requests only build it, which checks the English and Japanese strings
# match the template.
on:
  push:
    branches: [main]
    paths: ['site/**', 'icons/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'icons/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: python3 site/build.py --out _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
